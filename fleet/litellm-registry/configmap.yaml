apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inference-system
data:
  config.yaml: |
    model_list:
      - model_name: vllm-model
        litellm_params:
          model: openai/facebook/opt-125m
          api_base: http://vllm-runtime.inference-system.svc.cluster.local:8000/v1
          api_key: "dummy"
    
    general_settings:
      master_key: "sk-1234"  # Change in production
      database_url: "sqlite:////app/litellm.db"
