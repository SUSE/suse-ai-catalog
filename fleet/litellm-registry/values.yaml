replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

litellm:
  # For production, set existingSecretName and rotate this value out.
  masterKey: "change-me-in-production"
  existingSecretName: ""
  existingSecretKey: "master-key"
  databaseUrl: "sqlite:////app/litellm.db"
  storeModelInDb: "True"
  numWorkers: 4

  # Each entry becomes a LiteLLM model alias that proxies to one backend.
  # apiBase should be the vLLM service URL ending with /v1.
  modelList:
    - modelName: vllm-opt-125m
      providerModel: openai/facebook/opt-125m
      apiBase: http://vllm-opt-125m-vllm-runtime.inference-system.svc.cluster.local:8000/v1
      apiKey: "dummy"

nameOverride: ""
fullnameOverride: ""
