apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: vllm-opt-125m
  namespace: fleet-default
spec:
  repo: <your-git-repo-url>
  branch: main
  paths:
    - fleet/vllm-runtime
  targetNamespace: inference-system
  helm:
    releaseName: vllm-opt-125m
    values:
      model:
        name: facebook/opt-125m
        maxModelLen: 2048
        trustRemoteCode: false
      replicaCount: 1
      resources:
        requests:
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          memory: 8Gi
          nvidia.com/gpu: "1"
