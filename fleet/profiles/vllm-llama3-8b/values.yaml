model:
  name: "meta-llama/Meta-Llama-3-8B-Instruct"
  maxModelLen: 8192
  trustRemoteCode: false

replicaCount: 2

resources:
  requests:
    memory: "16Gi"
    nvidia.com/gpu: "1"
  limits:
    memory: "32Gi"
    nvidia.com/gpu: "1"

vllm:
  extraArgs:
    - "--dtype=float16"
    - "--max-num-seqs=256"
