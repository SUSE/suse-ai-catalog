apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-runtime
  namespace: inference-system
  labels:
    app: vllm-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-runtime
  template:
    metadata:
      labels:
        app: vllm-runtime
    spec:
      # Ensure pod is scheduled on GPU nodes
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.15.1-cu130
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_NAME
          value: "facebook/opt-125m"  # Lightweight model for testing
        - name: MAX_MODEL_LEN
          value: "2048"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        resources:
          requests:
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            nvidia.com/gpu: "1"
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --model
        - $(MODEL_NAME)
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
