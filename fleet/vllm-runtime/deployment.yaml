apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-runtime
  namespace: inference-system
  labels:
    app: vllm-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-runtime
  template:
    metadata:
      labels:
        app: vllm-runtime
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_NAME
          value: "facebook/opt-125m"  # Lightweight model for testing
        - name: MAX_MODEL_LEN
          value: "2048"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --model
        - $(MODEL_NAME)
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
