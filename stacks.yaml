modules:
  litellm-registry:
    displayName: LiteLLM Registry
    description: Model registry and proxy for unified LLM access.
    deploy:
      type: yaml
      path: fleet/litellm-registry
    targetNamespace: inference-system

  vllm-runtime:
    displayName: vLLM Runtime
    description: GPU optimized LLM runtime with batching and KV cache.
    deploy:
      type: yaml
      path: fleet/vllm-runtime
    targetNamespace: inference-system

stacks:
  inference-core:
    displayName: Inference Core
    description: Baseline model gateway and serving runtime for LLM inference.
    category: Inference
    maintainers:
      - platform-ml@suse.com
    modules:
      - id: vllm-runtime
      - id: litellm-registry
        dependsOn:
          - vllm-runtime
